server:
  port: 8080

spring:
  application:
    name: pet-adoption-system
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/pet_adoption?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root123456}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.petadopt.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT配置
jwt:
  secret: PetAdoptionSystemSecretKey2024VeryLongAndSecure
  expiration: 86400000

# 文件上传配置
file:
  upload-path: ${FILE_UPLOAD_PATH:./uploads/}
  allowed-types: jpg,jpeg,png,gif,mp4,webm
  max-size: 10485760

logging:
  level:
    com.petadopt: ${LOG_LEVEL:info}
    org.springframework.web: info
